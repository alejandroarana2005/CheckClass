<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckClass - Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:        #1e3a5f;
      --azul-hover:  #274d7e;
      --acento:      #3b82f6;
      --verde:       #10b981;
      --rojo:        #ef4444;
      --fondo:       #f1f5f9;
      --superficie:  #ffffff;
      --borde:       #e2e8f0;
      --texto:       #1e293b;
      --texto-suave: #64748b;
      --sombra:      0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
      --radio:       12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--azul);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .header-logo svg {
      opacity: .9;
    }

    .estado-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,.85);
    }

    .estado-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
      transition: background .3s;
    }

    .estado-dot.conectado  { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
    .estado-dot.reconectando { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }

    /* ── Layout principal ── */
    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: auto auto;
      gap: 20px;
    }

    /* ── Tarjeta base ── */
    .card {
      background: var(--superficie);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      border: 1px solid var(--borde);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--texto);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg { color: var(--texto-suave); }

    .card-body { padding: 20px; }

    /* ── Sección cámara ── */
    .seccion-camara {
      grid-column: 1;
      grid-row: 1 / 3;
    }

    #camara {
      display: block;
      width: 100%;
      aspect-ratio: 4/3;
      background: #0f172a;
      object-fit: cover;
    }

    .camara-footer {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--borde);
      font-size: 13px;
      color: var(--texto-suave);
    }

    .camara-footer svg { flex-shrink: 0; }

    /* ── Asistencia ── */
    .seccion-asistencia { grid-column: 2; grid-row: 1; }

    .contador-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--borde);
    }

    .contador-num {
      font-size: 36px;
      font-weight: 700;
      color: var(--azul);
      line-height: 1;
    }

    .contador-label {
      font-size: 13px;
      color: var(--texto-suave);
      line-height: 1.4;
    }

    .btn-reiniciar {
      margin-left: auto;
      background: none;
      border: 1px solid var(--borde);
      color: var(--rojo);
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background .15s, border-color .15s;
    }

    .btn-reiniciar:hover {
      background: #fef2f2;
      border-color: var(--rojo);
    }

    #lista {
      list-style: none;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
    }

    #lista:empty::after {
      content: "Sin asistencias registradas aún";
      display: block;
      text-align: center;
      color: var(--texto-suave);
      font-size: 13px;
      padding: 24px 0;
    }

    #lista li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--fondo);
      border: 1px solid transparent;
      transition: background .15s;
    }

    #lista li.nuevo {
      animation: resaltar 2.5s ease-out;
    }

    @keyframes resaltar {
      0%   { background: #d1fae5; border-color: #6ee7b7; }
      100% { background: var(--fondo); border-color: transparent; }
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--azul), var(--acento));
      color: white;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .asistencia-info { flex: 1; min-width: 0; }

    .asistencia-nombre {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .asistencia-hora {
      font-size: 12px;
      color: var(--texto-suave);
      margin-top: 1px;
    }

    /* ── Sección inferior (registro + estudiantes) ── */
    .seccion-inferior {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Formulario ── */
    .form-grupo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .form-input {
      padding: 9px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--texto);
      background: var(--fondo);
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
      background: white;
    }

    .btn-primario {
      width: 100%;
      background: var(--azul);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-primario:hover { background: var(--azul-hover); }

    .msg {
      font-size: 13px;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 7px;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .msg.error {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }

    /* ── Lista estudiantes ── */
    #lista-estudiantes {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    #lista-estudiantes li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--fondo);
      font-size: 13px;
    }

    #lista-estudiantes .est-nombre { flex: 1; font-weight: 500; }
    #lista-estudiantes .est-codigo { color: var(--texto-suave); font-size: 12px; }

    /* ── Scrollbar sutil ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 10px; }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .seccion-camara  { grid-column: 1; grid-row: 1; }
      .seccion-asistencia { grid-column: 1; grid-row: 2; }
      .seccion-inferior   { grid-column: 1; grid-row: 3; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM3 19a9 9 0 0 1 18 0"/>
      </svg>
      CheckClass
    </div>
    <div class="estado-badge">
      <span class="estado-dot" id="estado-dot"></span>
      <span id="estado">Conectando...</span>
    </div>
  </header>

  <main>

    <!-- Cámara -->
    <div class="card seccion-camara">
      <div class="card-header">
        <span class="card-title">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9A2.25 2.25 0 0 0 13.5 5.25h-9A2.25 2.25 0 0 0 2.25 7.5v9A2.25 2.25 0 0 0 4.5 18.75Z"/>
          </svg>
          Cámara en vivo
        </span>
      </div>
      <canvas id="camara" width="640" height="480"></canvas>
      <div class="camara-footer">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4l2 2"/>
        </svg>
        <span id="estado-camara">Esperando el módulo local...</span>
      </div>
    </div>

    <!-- Asistencia -->
    <div class="card seccion-asistencia">
      <div class="card-header">
        <span class="card-title">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
          </svg>
          Asistencia de hoy
        </span>
      </div>
      <div class="contador-wrap">
        <div>
          <div class="contador-num" id="contador">0</div>
          <div class="contador-label">estudiantes<br>presentes</div>
        </div>
        <button class="btn-reiniciar" id="btn-reiniciar">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
          </svg>
          Reiniciar
        </button>
      </div>
      <ul id="lista"></ul>
    </div>

    <!-- Inferior -->
    <div class="seccion-inferior">

      <!-- Registrar -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z"/>
            </svg>
            Registrar estudiante
          </span>
        </div>
        <div class="card-body">
          <form id="form-registro">
            <div class="form-grupo">
              <label class="form-label" for="reg-nombre">Nombre completo</label>
              <input class="form-input" type="text" id="reg-nombre" placeholder="Ej. María García" required>
            </div>
            <div class="form-grupo">
              <label class="form-label" for="reg-foto">Foto de referencia</label>
              <input class="form-input" type="file" id="reg-foto" accept="image/*" required>
            </div>
            <button class="btn-primario" type="submit">Registrar estudiante</button>
          </form>
          <p id="msg-registro" class="msg" hidden></p>
        </div>
      </div>

      <!-- Lista estudiantes -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/>
            </svg>
            Estudiantes registrados
          </span>
        </div>
        <div class="card-body" style="padding: 12px 16px;">
          <ul id="lista-estudiantes"></ul>
        </div>
      </div>

    </div>
  </main>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const HOST_API = parametros.get("api") || "api.checkclass.qd.je";
    const SEGURO = window.location.protocol === "https:";

    const HTTP = (SEGURO ? "https://" : "http://") + HOST_API;
    const WS = (SEGURO ? "wss://" : "ws://") + HOST_API + "/panel";

    const lista = document.getElementById("lista");
    const contador = document.getElementById("contador");
    const estado = document.getElementById("estado");
    const estadoDot = document.getElementById("estado-dot");
    const presentes = new Set();
    const camara = document.getElementById("camara");
    const contextoCamara = camara.getContext("2d");
    const estadoCamara = document.getElementById("estado-camara");
    let numeroFrame = 0;

    function iniciales(nombre) {
      return nombre.split(" ").slice(0, 2).map(p => p[0]).join("").toUpperCase();
    }

    function formatearHora(texto) {
      const conZona = /Z|[+-]\d\d:\d\d$/.test(texto) ? texto : texto + "Z";
      return new Date(conZona).toLocaleTimeString("es-CO");
    }

    function agregar(idEstudiante, nombreEstudiante, hora, esNuevo) {
      if (presentes.has(idEstudiante)) return;
      presentes.add(idEstudiante);

      const nombre = nombreEstudiante || ("Estudiante " + idEstudiante);

      const li = document.createElement("li");
      if (esNuevo) li.classList.add("nuevo");

      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = iniciales(nombre);

      const info = document.createElement("div");
      info.className = "asistencia-info";

      const n = document.createElement("div");
      n.className = "asistencia-nombre";
      n.textContent = nombre;

      const h = document.createElement("div");
      h.className = "asistencia-hora";
      h.textContent = formatearHora(hora);

      info.append(n, h);
      li.append(av, info);
      lista.prepend(li);
      contador.textContent = presentes.size;
    }

    async function cargarHoy() {
      try {
        const respuesta = await fetch(HTTP + "/asistencias/hoy");
        const filas = await respuesta.json();
        filas.forEach(f => agregar(f.id_estudiante, f.nombre, f.fecha_hora, false));
      } catch (e) {
        console.error("No se pudo cargar el historial de hoy", e);
      }
    }

    function conectar() {
      const ws = new WebSocket(WS);
      ws.binaryType = "blob";

      ws.onopen = () => {
        estado.textContent = "Conectado";
        estadoDot.className = "estado-dot conectado";
        estadoCamara.textContent = "Esperando el módulo local...";
      };
      ws.onmessage = (evento) => {
        if (evento.data instanceof Blob) {
          const frameActual = ++numeroFrame;
          createImageBitmap(evento.data).then((imagen) => {
            if (frameActual === numeroFrame) {
              camara.width = imagen.width;
              camara.height = imagen.height;
              contextoCamara.drawImage(imagen, 0, 0);
              estadoCamara.textContent = "Video en vivo";
            }
            imagen.close();
          }).catch((error) => console.error("No se pudo mostrar el video", error));
          return;
        }
        const datos = JSON.parse(evento.data);
        agregar(datos.id_estudiante, datos.nombre, datos.hora, true);
      };
      ws.onclose = () => {
        estado.textContent = "Reconectando...";
        estadoDot.className = "estado-dot reconectando";
        estadoCamara.textContent = "Conexión con el backend interrumpida";
        setTimeout(conectar, 3000);
      };
    }

    async function cargarEstudiantes() {
      try {
        const resp = await fetch(HTTP + "/estudiantes");
        const listaEl = document.getElementById("lista-estudiantes");
        listaEl.innerHTML = "";
        (await resp.json()).forEach(est => {
          const li = document.createElement("li");

          const av = document.createElement("div");
          av.className = "avatar";
          av.style.cssText = "width:28px;height:28px;font-size:11px;flex-shrink:0";
          av.textContent = iniciales(est.nombre);

          const n = document.createElement("span");
          n.className = "est-nombre";
          n.textContent = est.nombre;

          const c = document.createElement("span");
          c.className = "est-codigo";
          c.textContent = est.codigo;

          li.append(av, n, c);
          listaEl.appendChild(li);
        });
      } catch (e) { console.error("No se pudo cargar la lista de estudiantes", e); }
    }

    document.getElementById("form-registro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg-registro");
      const datos = new FormData();
      datos.append("nombre", document.getElementById("reg-nombre").value);
      datos.append("foto", document.getElementById("reg-foto").files[0]);
      msg.hidden = false;
      msg.className = "msg";
      msg.textContent = "Registrando...";
      try {
        const resp = await fetch(HTTP + "/estudiantes", { method: "POST", body: datos });
        if (resp.ok) {
          const est = await resp.json();
          msg.textContent = `${est.nombre} registrado con código ${est.codigo}.`;
          e.target.reset();
          cargarEstudiantes();
        } else {
          msg.className = "msg error";
          msg.textContent = "Error al registrar el estudiante.";
        }
      } catch {
        msg.className = "msg error";
        msg.textContent = "No se pudo conectar al backend.";
      }
    });

    document.getElementById("btn-reiniciar").addEventListener("click", async () => {
      if (!confirm("¿Borrar todas las asistencias de hoy?")) return;
      await fetch(HTTP + "/asistencias/hoy", { method: "DELETE" });
      location.reload();
    });

    cargarHoy();
    cargarEstudiantes();
    conectar();
  </script>
</body>
</html>
