<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckClass - Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:        #1e3a5f;
      --azul-hover:  #274d7e;
      --acento:      #3b82f6;
      --verde:       #10b981;
      --rojo:        #ef4444;
      --fondo:       #f1f5f9;
      --superficie:  #ffffff;
      --borde:       #e2e8f0;
      --texto:       #1e293b;
      --texto-suave: #64748b;
      --sombra:      0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
      --radio:       12px;
    }

    [data-theme="oscuro"] {
      --acento:      #60a5fa;
      --verde:       #34d399;
      --rojo:        #f87171;
      --fondo:       #0f172a;
      --superficie:  #1e293b;
      --borde:       #334155;
      --texto:       #f1f5f9;
      --texto-suave: #94a3b8;
      --sombra:      0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      transition: background .2s, color .2s;
    }

    /* ── Header ── */
    header {
      background: var(--azul);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.3px;
    }
    .estado-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,.85);
    }
    .estado-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
      transition: background .3s;
    }
    .estado-dot.conectado    { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
    .estado-dot.reconectando { background: #f59e0b;      box-shadow: 0 0 6px #f59e0b; }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: auto auto;
      gap: 20px;
    }
    #slot-camara     { grid-column: 1; grid-row: 1 / 3; }
    #slot-asistencia { grid-column: 2; grid-row: 1; }
    .seccion-inferior {
      grid-column: 2; grid-row: 2;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* ── Tarjeta base (compartida por todos los MF) ── */
    .card {
      background: var(--superficie);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      border: 1px solid var(--borde);
      overflow: hidden;
      transition: background .2s, border-color .2s;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--borde);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title {
      font-size: 14px; font-weight: 600; color: var(--texto);
      display: flex; align-items: center; gap: 8px;
    }
    .card-title svg { color: var(--texto-suave); }
    .card-body { padding: 20px; }

    /* ── Formulario (compartido) ── */
    .form-grupo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-label {
      font-size: 12px; font-weight: 600;
      color: var(--texto-suave);
      text-transform: uppercase; letter-spacing: .4px;
    }
    .form-input {
      padding: 9px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      font-size: 14px; font-family: inherit;
      color: var(--texto);
      background: var(--fondo);
      transition: border-color .15s, box-shadow .15s, background .2s;
      width: 100%;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
      background: var(--superficie);
    }
    [data-theme="oscuro"] .form-input { background: #0f172a; color: var(--texto); }
    [data-theme="oscuro"] .form-input:focus { background: #1e293b; }

    .btn-primario {
      width: 100%; background: var(--azul); color: white;
      border: none; padding: 10px 16px; border-radius: 8px;
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s;
    }
    .btn-primario:hover { background: var(--azul-hover); }

    .msg {
      font-size: 13px; margin-top: 10px; padding: 8px 12px;
      border-radius: 7px; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
    }
    .msg.error { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 10px; }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr; grid-template-rows: auto;
        margin: 16px auto; padding: 0 12px; gap: 14px;
      }
      #slot-camara     { grid-column: 1; grid-row: 1; }
      #slot-asistencia { grid-column: 1; grid-row: 2; }
      .seccion-inferior { grid-column: 1; grid-row: 3; }
      header { padding: 0 16px; }
      .header-logo { font-size: 16px; }
      .estado-badge { padding: 4px 10px; font-size: 12px; }
    }
    @media (max-width: 420px) {
      .header-logo svg { display: none; }
      #nombre-curso { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM3 19a9 9 0 0 1 18 0"/>
      </svg>
      CheckClass
      <span id="nombre-curso" style="font-size:13px;font-weight:400;opacity:.7;margin-left:4px;"></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="btn-tema" title="Cambiar tema"
        style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:white;border-radius:8px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
        </svg>
      </button>
      <div class="estado-badge">
        <span class="estado-dot" id="estado-dot"></span>
        <span id="estado">Conectando...</span>
      </div>
    </div>
  </header>

  <main>
    <div id="slot-camara"></div>
    <div id="slot-asistencia"></div>
    <div class="seccion-inferior">
      <div id="slot-registro"></div>
      <div id="slot-estudiantes"></div>
    </div>
  </main>

  <script>
    // ── Config global accesible por todos los microfrontends ──
    const parametros = new URLSearchParams(window.location.search);
    const HOST_API   = parametros.get("api") || "api.checkclass.qd.je";
    const SEGURO     = window.location.protocol === "https:";

    window.CHECKCLASS = {
      HTTP: (SEGURO ? "https://" : "http://") + HOST_API,
    };

    const WS_URL = (SEGURO ? "wss://" : "ws://") + HOST_API + "/panel";

    // ── Modo oscuro ──
    if (localStorage.getItem("tema") === "oscuro") {
      document.documentElement.dataset.theme = "oscuro";
    }
    document.getElementById("btn-tema").addEventListener("click", () => {
      const oscuro = document.documentElement.dataset.theme === "oscuro";
      document.documentElement.dataset.theme = oscuro ? "" : "oscuro";
      localStorage.setItem("tema", oscuro ? "claro" : "oscuro");
    });

    // ── Nombre del curso ──
    fetch(window.CHECKCLASS.HTTP + "/cursos")
      .then(r => r.json())
      .then(cursos => {
        if (cursos.length) {
          document.getElementById("nombre-curso").textContent = "· " + cursos[0].nombre;
        }
      }).catch(() => {});

    // ── Cargador de microfrontends ──
    // Descarga el HTML de cada MF, lo inyecta en su slot y re-ejecuta sus scripts
    // (innerHTML no ejecuta <script> automáticamente)
    async function cargarMF(ruta, idSlot) {
      const slot = document.getElementById(idSlot);
      try {
        const html = await (await fetch(ruta)).text();
        slot.innerHTML = html;
        slot.querySelectorAll("script").forEach(s => {
          const nuevo = document.createElement("script");
          nuevo.textContent = s.textContent;
          s.replaceWith(nuevo);
        });
      } catch (e) {
        console.error(`No se pudo cargar el microfrontend ${ruta}:`, e);
      }
    }

    // ── WebSocket — se conecta después de que todos los MF estén listos ──
    // Despacha CustomEvents para que cada MF reaccione de forma independiente
    function conectar() {
      const ws = new WebSocket(WS_URL);
      ws.binaryType = "blob";

      ws.onopen = () => {
        document.getElementById("estado").textContent = "Conectado";
        document.getElementById("estado-dot").className = "estado-dot conectado";
        window.dispatchEvent(new CustomEvent("checkclass:conexion", {
          detail: { estado: "conectado" },
        }));
      };

      ws.onmessage = (evento) => {
        if (evento.data instanceof Blob) {
          window.dispatchEvent(new CustomEvent("checkclass:frame", {
            detail: evento.data,
          }));
          return;
        }
        const datos = JSON.parse(evento.data);
        window.dispatchEvent(new CustomEvent("checkclass:asistencia", {
          detail: datos,
        }));
      };

      ws.onclose = () => {
        document.getElementById("estado").textContent = "Reconectando...";
        document.getElementById("estado-dot").className = "estado-dot reconectando";
        window.dispatchEvent(new CustomEvent("checkclass:conexion", {
          detail: { estado: "reconectando" },
        }));
        setTimeout(conectar, 3000);
      };
    }

    // Cargar los 4 microfrontends en paralelo y luego abrir el WebSocket
    Promise.all([
      cargarMF("./mf-camara/index.html",      "slot-camara"),
      cargarMF("./mf-asistencia/index.html",  "slot-asistencia"),
      cargarMF("./mf-registro/index.html",    "slot-registro"),
      cargarMF("./mf-estudiantes/index.html", "slot-estudiantes"),
    ]).then(() => conectar());
  </script>

</body>
</html>
