<style>
  #mf-estudiantes-lista {
    list-style: none;
    display: flex; flex-direction: column; gap: 6px;
    max-height: 220px; overflow-y: auto;
    padding: 4px 2px;
  }
  #mf-estudiantes-lista li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px;
    background: var(--fondo); font-size: 13px;
  }
  [data-theme="oscuro"] #mf-estudiantes-lista li { background: #0f172a; }
  .mf-est-nombre { flex: 1; font-weight: 500; }
  .mf-est-codigo { color: var(--texto-suave); font-size: 12px; }
  .mf-avatar-sm {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--azul), var(--acento));
    color: white; font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mf-est-pct {
    font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px;
    background: #dcfce7; color: #166534;
  }
  .mf-est-pct.bajo     { background: #fef9c3; color: #854d0e; }
  .mf-est-pct.muy-bajo { background: #fee2e2; color: #991b1b; }
  [data-theme="oscuro"] .mf-est-pct          { background: #14532d; color: #86efac; }
  [data-theme="oscuro"] .mf-est-pct.bajo     { background: #422006; color: #fde68a; }
  [data-theme="oscuro"] .mf-est-pct.muy-bajo { background: #450a0a; color: #fca5a5; }
</style>

<div class="card">
  <div class="card-header">
    <span class="card-title">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/>
      </svg>
      Estudiantes registrados
    </span>
  </div>
  <div style="padding:10px 16px 0;border-bottom:1px solid var(--borde);">
    <input id="mf-estudiantes-buscador" class="form-input"
      type="search" placeholder="Buscar estudiante..." style="margin:0 0 10px;">
  </div>
  <div class="card-body" style="padding:12px 16px;">
    <ul id="mf-estudiantes-lista"></ul>
  </div>
</div>

<script>
  (function () {
    const HTTP = window.CHECKCLASS.HTTP;

    function iniciales(nombre) {
      return nombre.split(" ").slice(0, 2).map(p => p[0]).join("").toUpperCase();
    }

    document.getElementById("mf-estudiantes-buscador").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll("#mf-estudiantes-lista li").forEach(li => {
        li.style.display = li.querySelector(".mf-est-nombre")
          .textContent.toLowerCase().includes(q) ? "" : "none";
      });
    });

    async function cargarEstudiantes() {
      const listaEl = document.getElementById("mf-estudiantes-lista");
      listaEl.innerHTML = "";
      try {
        const estudiantes = await (await fetch(HTTP + "/estudiantes")).json();
        estudiantes.forEach(est => {
          const li = document.createElement("li");

          const av = document.createElement("div");
          av.className = "mf-avatar-sm";
          av.textContent = iniciales(est.nombre);

          const n = document.createElement("span");
          n.className = "mf-est-nombre";
          n.textContent = est.nombre;

          const c = document.createElement("span");
          c.className = "mf-est-codigo";
          c.textContent = est.codigo;

          const pct = document.createElement("span");
          pct.className = "mf-est-pct";
          pct.textContent = "...";
          fetch(HTTP + "/estadisticas/" + est.id).then(r => r.json()).then(s => {
            pct.textContent = s.porcentaje_asistencia + "%";
            if (s.porcentaje_asistencia < 70) pct.classList.add("bajo");
            if (s.porcentaje_asistencia < 50) pct.classList.add("muy-bajo");
          }).catch(() => { pct.remove(); });

          li.append(av, n, c, pct);
          listaEl.appendChild(li);
        });
      } catch (e) { console.error("No se pudo cargar estudiantes", e); }
    }

    // Se recarga cuando mf-registro registra un estudiante nuevo
    window.addEventListener("checkclass:nuevo-estudiante", () => cargarEstudiantes());

    cargarEstudiantes();
  })();
</script>
